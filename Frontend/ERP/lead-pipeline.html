<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="js/storage-guard.js"></script>
<script src="js/modules/auth-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Pipeline - VISHAK TECH Enterprise CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/leads.css">
    <link rel="stylesheet" href="css/sales-crm.css">
    <link rel="stylesheet" href="css/pagination.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/unified.css">
    <style>
        /* Pipeline KPI grid — reuses lead-kpi-grid from leads.css */
        #pipelineKpiGrid { display:none; }
        #pipelineKpiGrid.show { display:grid; }
        .pipeline-filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding:12px 16px; background:var(--bg-card,#fff); border:1px solid var(--border-color,#e5e7eb); border-radius:12px; align-items:center; }
        .pipeline-filter-bar .search-box { position:relative; flex:1; min-width:180px; max-width:300px; }
        .pipeline-filter-bar .search-box i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted,#9ca3af); font-size:13px; }
        .pipeline-filter-bar .search-box input { width:100%; padding:7px 10px 7px 32px; border:1px solid var(--border-color,#e5e7eb); border-radius:8px; font-size:13px; font-family:Inter,sans-serif; outline:none; transition:border-color 0.15s,box-shadow 0.15s; }
        .pipeline-filter-bar .search-box input:focus { border-color:var(--accent,#0B4A3D); box-shadow:0 0 0 3px rgba(11,74,61,0.1); }
        .pipeline-filter-bar select { padding:7px 12px; border:1px solid var(--border-color,#e5e7eb); border-radius:8px; font-size:13px; font-family:Inter,sans-serif; outline:none; background:var(--bg-card,#fff); cursor:pointer; min-width:120px; transition:border-color 0.15s; }
        .pipeline-filter-bar select:focus { border-color:var(--accent,#0B4A3D); }
        .pipeline-filter-bar .btn { padding:7px 14px; }
        @media(max-width:768px) {
            .pipeline-filter-bar { flex-direction:column; align-items:stretch; }
            .pipeline-filter-bar .search-box { max-width:none; }
            .pipeline-filter-bar select { min-width:auto; }
        }
    </style>
</head>
<body data-page="lead-pipeline">
    <nav class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo">V</div>
            <div class="brand-text">
                <div class="brand-name">VISHAK TECH</div>
                <div class="brand-sub">Enterprise Portal</div>
            </div>
        </div>
        <div class="sidebar-user-card">
            <div class="user-avatar-wrap">
                <div class="user-avatar">A</div>
                <span class="user-online"></span>
            </div>
            <div class="user-info">
                <div class="user-name">Admin User</div>
                <div class="user-role">Administrator</div>
            </div>
        </div>
        <div class="sidebar-search">
            <i class="fas fa-search sidebar-search-icon"></i>
            <input type="text" placeholder="Search menu..." aria-label="Search menu" oninput="VT.Sidebar.filterMenu(this.value)">
        </div>
        <div class="sidebar-nav sidebar-menu"></div>
        <div class="sidebar-bottom">
            <a class="theme-toggle" onclick="VT.Theme.toggle()"><i class="fas fa-moon"></i><span>Dark Mode</span></a>
            <a onclick="VT.Auth.logout()"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></a>
        </div>
    </nav>
    <div class="sidebar-overlay"></div>
    <div class="main-area">
        <header class="topbar">
            <button class="topbar-toggle sidebar-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
            <h1 class="topbar-title">Lead Pipeline</h1>
            <div class="topbar-actions">
                <button class="theme-toggle" onclick="VT.Theme.toggle()" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
                <button class="notification-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notification-badge">3</span></button>
                <div class="user-dropdown">
                    <div class="user-dropdown-trigger" aria-label="User menu" role="button" tabindex="0"><div class="user-avatar small">A</div><i class="fas fa-chevron-down"></i></div>
                    <div class="user-dropdown-menu"><a href="#"><i class="fas fa-user-cog"></i> Settings</a><a href="#" onclick="VT.Auth.logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</a></div>
                </div>
            </div>
        </header>
        <div class="page-content pipeline-content">
            <div class="sales-breadcrumb">
                <a href="dashboard.html">VISHAK TECH</a> <i class="fas fa-chevron-right"></i>
                <a href="leads.html">Leads</a> <i class="fas fa-chevron-right"></i>
                <span>Pipeline</span>
            </div>
            <div id="pipelineFilterBar" class="pipeline-filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="pipelineSearchInput" placeholder="Search pipeline..." aria-label="Search pipeline leads" oninput="var q=this.value.toLowerCase();document.querySelectorAll('.pipeline-card').forEach(function(c){var n=c.querySelector('.pipeline-card-name');var co=c.querySelector('.pipeline-card-company');var match=(n&&n.textContent.toLowerCase().indexOf(q)!==-1)||(co&&co.textContent.toLowerCase().indexOf(q)!==-1);c.style.display=match?'':'none';})">
                </div>
                <select id="pipelineFilterOwner" aria-label="Filter by owner" onchange="var v=this.value;document.querySelectorAll('.pipeline-card').forEach(function(c){var o=c.querySelector('.pipeline-card-owner');var match=!v||(o&&o.textContent.toLowerCase().indexOf(v.toLowerCase())!==-1);c.style.display=match?'':'none';})"><option value="">All Owners</option></select>
                <select id="pipelineFilterPriority" aria-label="Filter by priority" onchange="var v=this.value;document.querySelectorAll('.pipeline-card').forEach(function(c){var p=c.querySelector('.pipeline-card-priority');var match=!v||(p&&p.classList.contains(v));c.style.display=match?'':'none';})"><option value="">All Priority</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select>
                <button class="btn btn-ghost btn-sm" onclick="document.getElementById('pipelineSearchInput').value='';document.getElementById('pipelineFilterOwner').value='';document.getElementById('pipelineFilterPriority').value='';document.querySelectorAll('.pipeline-card').forEach(function(c){c.style.display='';})" title="Clear filters"><i class="fas fa-times"></i> Clear</button>
            </div>
            <div id="pipelineContainer">
                <div class="sales-empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading Pipeline...</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>
    <script src="js/modules/data.js"></script>
    <script src="js/modules/auth.js"></script>
    <script src="js/modules/utils.js"></script>
<script src="js/modules/standard.js"></script>
    <script src="js/modules/theme.js?v=2"></script><script src="js/modules/session.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/modules/notification-service.js"></script>
    <script src="js/shared/format.js"></script>
<script src="js/shared/lead-utils.js"></script>
<script src="js/shared/datahub.js"></script>
<script src="js/shared/view-state-persistence.js"></script>
<script src="js/leads.js"></script>
    <script src="js/app.js"></script>
    <script>
    (function() {
        if (typeof VT !== 'undefined' && VT.NotificationService) {
            VT.NotificationService.init({ pollInterval: 60000, enableSound: true });
            VT.NotificationService.start();
        }
        document.addEventListener('VT:DataUpdated', function() {
            if (VT.NotificationService) VT.NotificationService.checkNow();
        });
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && VT.NotificationService) VT.NotificationService.checkNow();
        });
    })();
    </script>
</body>
</html>
