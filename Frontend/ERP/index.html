<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script src="js/storage-guard.js"></script>
<script src="js/modules/auth-shim.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISHAK TECH - Enterprise ERP</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forms.css">
    <style>
        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0F172A;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ===== LOGIN PAGE ===== */
        .login-page {
            display: flex;
            min-height: 100vh;
            width: 100%;
            background: #05070D;
            position: relative;
            overflow: hidden;
        }

        /* ===== PARTICLE NETWORK BACKGROUND (full-page canvas) ===== */
        .login-aurora {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #05070D;
            pointer-events: none;
        }
        #particleNetwork {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== SIGN IN PANEL (centered) ===== */
        .login-panel {
            flex: 0 0 100%;
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            position: relative;
            z-index: 1;
            background: transparent;
            min-height: 100vh;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Brand block (logo + subtitle + tagline), centered above the card */
        .login-brand-block {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand-logo {
            position: relative;
            display: flex;
            width: fit-content;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            padding: 22px 34px;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            opacity: 0;
            animation: logoRise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       logoFloat 6s ease-in-out 0.8s infinite;
        }
        .login-brand-logo::before {
            content: "";
            position: absolute;
            inset: -30%;
            z-index: -1;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.35) 0%, transparent 70%);
            filter: blur(24px);
            animation: logoGlow 4s ease-in-out infinite;
        }
        .login-brand-logo img {
            max-width: 140px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: brightness(1.15) drop-shadow(0 4px 14px rgba(0,0,0,0.3));
        }
        @keyframes logoRise {
            from { opacity: 0; transform: translateY(18px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        @keyframes logoGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50%      { opacity: 0.85; transform: scale(1.12); }
        }

        .login-brand-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeSlideUp 0.7s ease 0.1s forwards;
        }

        .login-brand-tagline {
            display: block;
            width: fit-content;
            margin: 0 auto;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            opacity: 0;
            animation: fadeSlideUp 0.7s ease 0.2s forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-form-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-radius: 22px;
            max-width: 440px;
            padding: 44px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.4s ease,
                        border-color 0.3s ease;
            position: relative;
            opacity: 0;
            animation: slideFromRight 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }
        .login-form-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Login header */
        .login-header {
            margin-bottom: 32px;
        }
        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }
        .login-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .input-icon-group {
            position: relative;
        }
        .input-icon-group .form-input {
            padding-left: 46px;
            padding-right: 46px;
            padding-top: 20px;
            padding-bottom: 8px;
            height: 50px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-icon-group .form-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }
        .input-icon-group .form-input:focus {
            border-color: #14B8A6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.12), 0 0 20px rgba(20, 184, 166, 0.05);
        }
        .input-icon-group .form-input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 50px rgba(15, 92, 77, 0.2) inset;
            -webkit-text-fill-color: #fff;
        }
        .input-icon-group .form-input:-moz-autofill {
            background: rgba(15, 92, 77, 0.2);
        }

        .input-icon-group .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            pointer-events: none;
            z-index: 2;
            transition: color 0.3s, transform 0.3s;
        }
        .input-icon-group .form-input:focus ~ .input-icon {
            color: #14B8A6;
            transform: translateY(-50%) scale(1.1);
        }

        /* ===== FLOATING LABELS ===== */
        .float-label {
            position: absolute;
            left: 46px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            line-height: 1;
            font-weight: 400;
            transform-origin: left center;
        }
        .input-icon-group:focus-within .float-label,
        .input-icon-group.has-value .float-label {
            top: 8px;
            transform: translateY(0) scale(0.82);
            left: 46px;
            color: #14B8A6;
            font-weight: 500;
        }

        .password-toggle {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            padding: 10px 12px;
            font-size: 17px;
            transition: color 0.3s;
            z-index: 2;
        }
        .password-toggle:hover {
            color: #14B8A6;
        }

        /* ===== OPTIONS ===== */
        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 22px 0 28px;
        }
        .login-options .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: color 0.2s;
        }
        .login-options .form-check:hover {
            color: rgba(255, 255, 255, 0.6);
        }
        .login-options .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #14B8A6;
            cursor: pointer;
            border-radius: 3px;
        }

        .forgot-link {
            font-size: 13px;
            color: rgba(22, 160, 133, 0.7);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #14B8A6;
            text-decoration: underline;
        }

        /* ===== SIGN IN BUTTON ===== */
        .btn-login {
            background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
            color: #fff;
            height: 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(15, 118, 110, 0.35);
            position: relative;
            overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #14B8A6 0%, #0F766E 100%);
            opacity: 0;
            transition: opacity 0.35s ease;
            border-radius: 12px;
        }
        .btn-login:hover::before {
            opacity: 1;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(15, 118, 110, 0.45);
        }
        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-login span, .btn-login i {
            position: relative;
            z-index: 1;
        }

        /* Ripple */
        .btn-login .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* Loading spinner */
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            position: relative;
            z-index: 1;
        }
        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }
        .btn-login.loading .btn-icon { display: none; }
        .btn-login.loading { pointer-events: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            opacity: 0;
            animation: fadeIn 0.8s ease 0.5s forwards;
        }
        .login-footer span {
            display: block;
            margin-top: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== MOUSE PARALLAX ===== */
        .parallax-layer {
            transition: transform 0.15s ease-out;
        }

        /* ===== LIGHT THEME OVERRIDES (Warm Premium Palette) ===== */

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .login-form-card { padding: 36px 32px; }
        }

        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .login-page { flex-direction: column; overflow-y: auto; }

            .login-panel {
                flex: none; max-width: 100%;
                padding: 20px 16px 32px;
                min-height: auto;
            }
            .login-card-wrapper { max-width: 100%; }
            .login-form-card {
                padding: 32px 24px;
                border-radius: 16px;
            }
            .login-header h2 { font-size: 22px; }
            .login-header p { font-size: 13px; }
            .input-icon-group .form-input { height: 46px; }
            .login-options { flex-direction: column; align-items: flex-start; gap: 12px; }
        }

        @media (max-width: 480px) {
            .login-form-card { padding: 24px 18px; border-radius: 14px; }
            .login-header h2 { font-size: 20px; }
            .btn-login { height: 46px; font-size: 14px; }
        }
        /* ===== FIELD VALIDATION ERRORS ===== */
        .field-error {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 500;
            color: #EF4444;
            margin-top: 4px;
            margin-left: 4px;
            min-height: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
        }
        .field-error.visible {
            max-height: 24px;
            opacity: 1;
            margin-top: 3px;
        }
        .field-error i {
            font-size: 10px;
            flex-shrink: 0;
        }

        .input-icon-group.has-error .form-input {
            border-color: #EF4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.10);
        }
        .input-icon-group.has-error .float-label {
            color: #EF4444 !important;
        }
        .input-icon-group.has-error .input-icon {
            color: #EF4444 !important;
        }
        .input-icon-group.has-error .form-input:focus {
            border-color: #EF4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12), 0 0 20px rgba(239, 68, 68, 0.05);
        }
        .input-icon-group.has-error .form-input:focus ~ .input-icon {
            color: #EF4444 !important;
        }

        /* ===== SHAKE ANIMATION ===== */
        @keyframes shakeCard {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(8px); }
            30% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            70% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
        }
        .login-form-card.shake {
            animation: shakeCard 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
            border-color: rgba(239, 68, 68, 0.3);
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/unified.css">
</head>
<body>
    <div class="login-page parallax-container">
        <!-- ===== AURORA ANIMATED BACKGROUND ===== -->
        <div class="login-aurora">
            <canvas id="particleNetwork"></canvas>
        </div>

        <!-- ===== SIGN IN PANEL (centered) ===== -->
        <div class="login-panel">
            <div class="login-card-wrapper">
                <div class="login-brand-block">
                    <div class="login-brand-logo parallax-layer" data-speed="0.03">
                        <img src="assets/images/logo.png" alt="Logo">
                    </div>
                    <div class="login-brand-subtitle parallax-layer" data-speed="0.015">Enterprise Resource Planning</div>
                    <div class="login-brand-tagline parallax-layer" data-speed="0.01">Secure. Reliable. Scalable.</div>
                </div>

                <div class="login-form-card parallax-layer" data-speed="0.02">
                    <div class="login-header">
                        <h2>Sign In</h2>
                        <p>Sign in to continue.</p>
                    </div>

                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <div class="input-icon-group">
                                <input type="email" class="form-input" id="loginEmail" value="admin@vishaktech.com" autocomplete="email" required>
                                <label for="loginEmail" class="float-label">Email</label>
                                <i class="fa-solid fa-envelope input-icon"></i>
                            </div>
                            <div class="field-error" id="emailError"></div>
                        </div>
                        <div class="form-group">
                            <div class="input-icon-group">
                                <input type="password" class="form-input" id="loginPassword" autocomplete="current-password" required>
                                <label for="loginPassword" class="float-label">Password</label>
                                <i class="fa-solid fa-lock input-icon"></i>
                                <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                                    <i class="fa-solid fa-eye" id="passwordIcon"></i>
                                </button>
                            </div>
                            <div class="field-error" id="passwordError"></div>
                        </div>
                        <div class="login-options">
                            <label class="form-check">
                                <input type="checkbox" checked>
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn-login">
                            <span class="spinner"></span>
                            <i class="fa-solid fa-arrow-right-to-bracket btn-icon"></i>
                            <span class="btn-text">Sign In</span>
                        </button>
                    </form>
                </div>

                <div class="login-footer">
                    <span>Version 1.0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ===== PASSWORD VISIBILITY ===== */
        function togglePasswordVisibility() {
            var input = document.getElementById('loginPassword');
            var icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        /* ===== THEME: LOCKED TO DARK ===== */
        (function forceDarkTheme() {
            document.documentElement.setAttribute('data-theme', 'dark');
            try { localStorage.setItem('vt_theme', 'dark'); } catch (ex) {}
        })();

        /* ===== CHECK FOR STALE AUTH DATA (runs early, before auth.js) ===== */
        (function() {
            try {
                var raw = localStorage.getItem('vt_user');
                if (raw) {
                    var parsed = JSON.parse(raw);
                    /* Only redirect if valid user object with uid + email */
                    if (parsed && parsed.uid && parsed.email) {
                        window.location.href = 'dashboard.html';
                    } else {
                        /* Corrupt/incomplete data — clean it up */
                        localStorage.removeItem('vt_user');
                    }
                }
            } catch(e) {
                try { localStorage.removeItem('vt_user'); } catch(ex) {}
            }
        })();

        /* ===== BUTTON RIPPLE ===== */
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('.btn-login');
            if (!btn) return;
            var rect = btn.getBoundingClientRect();
            var ripple = document.createElement('span');
            ripple.className = 'ripple';
            var size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(function() { ripple.remove(); }, 600);
        });

        /* ===== MOUSE PARALLAX ===== */
        document.addEventListener('mousemove', function(e) {
            var layers = document.querySelectorAll('.parallax-layer');
            var x = (e.clientX / window.innerWidth - 0.5) * 2;
            var y = (e.clientY / window.innerHeight - 0.5) * 2;
            for (var i = 0; i < layers.length; i++) {
                var speed = parseFloat(layers[i].getAttribute('data-speed')) || 0.02;
                layers[i].style.transform = 'translate(' + (x * speed * 20) + 'px, ' + (y * speed * 20) + 'px)';
            }
        });

        /* ===== FLOATING LABELS ===== */
        (function initFloatingLabels() {
            var groups = document.querySelectorAll('.input-icon-group');
            for (var i = 0; i < groups.length; i++) {
                var input = groups[i].querySelector('input');
                if (!input) continue;
                if (input.value.trim() !== '') {
                    groups[i].classList.add('has-value');
                }
                input.addEventListener('input', function() {
                    var group = this.closest('.input-icon-group');
                    if (this.value.trim() !== '') {
                        group.classList.add('has-value');
                    } else {
                        group.classList.remove('has-value');
                    }
                    // Clear field error when user starts typing
                    if (group.classList.contains('has-error')) {
                        group.classList.remove('has-error');
                        var errorEl = document.getElementById(this.id + 'Error');
                        if (errorEl) {
                            errorEl.classList.remove('visible');
                            errorEl.innerHTML = '';
                        }
                    }
                });
                input.addEventListener('blur', function() {
                    var group = this.closest('.input-icon-group');
                    if (this.value.trim() !== '') {
                        group.classList.add('has-value');
                    } else {
                        group.classList.remove('has-value');
                    }
                });
            }
        })();

        /* ===== SHAKE ANIMATION ===== */
        var shakeTimeout = null;
        function shakeLoginCard() {
            var card = document.querySelector('.login-form-card');
            if (!card) return;
            if (shakeTimeout) clearTimeout(shakeTimeout);
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            shakeTimeout = setTimeout(function() {
                card.classList.remove('shake');
                shakeTimeout = null;
            }, 550);
        }

        /* ===== FIELD VALIDATION ===== */
        function setFieldError(inputId, message) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var group = input.closest('.input-icon-group');
            var errorEl = document.getElementById(inputId + 'Error');
            if (!group || !errorEl) return;
            group.classList.add('has-error');
            errorEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + message;
            errorEl.classList.add('visible');
        }

        function clearFieldErrors() {
            var groups = document.querySelectorAll('.input-icon-group.has-error');
            for (var i = 0; i < groups.length; i++) {
                groups[i].classList.remove('has-error');
            }
            var errors = document.querySelectorAll('.field-error.visible');
            for (var j = 0; j < errors.length; j++) {
                errors[j].classList.remove('visible');
                errors[j].innerHTML = '';
            }
        }

        /* ===== LOADING STATE ON SUBMIT ===== */
        document.getElementById('loginForm').addEventListener('submit', function() {
            clearFieldErrors();
            var btn = document.querySelector('.btn-login');
            btn.classList.add('loading');
        });
    </script>

        (function patchLoginShake() {
            var orig_toast = window._vtToast;
            if (typeof orig_toast !== 'function') return;
            window._vtToast = function(message, type) {
                if (type === 'danger') {
                    shakeLoginCard();
                    // Show field-level errors based on the message
                    var email = document.getElementById('loginEmail').value.trim();
                    var password = document.getElementById('loginPassword').value.trim();
                    if (!email) {
                        setFieldError('loginEmail', 'Please enter your email address');
                    } else if (email !== 'admin@vishaktech.com') {
                        setFieldError('loginEmail', 'Email not found');
                    }
                    if (!password) {
                        setFieldError('loginPassword', 'Please enter your password');
                    } else if (email === 'admin@vishaktech.com') {
                        // Correct email, wrong password
                        setFieldError('loginPassword', 'Incorrect password');
                    }
                }
                return orig_toast(message, type);
            };
        })();

    <script>
        /* ===== PARTICLE NETWORK (CONSTELLATION) BACKGROUND ===== */
        (function() {
            var canvas = document.getElementById('particleNetwork');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var particles = [];
            var mouse = { x: null, y: null };
            var DPR = Math.min(window.devicePixelRatio || 1, 2);
            var started = false;

            var PARTICLE_COLOR = '20, 184, 166';   /* teal accent, matches brand */
            var LINE_COLOR = '20, 184, 166';
            var LINK_DIST = 140;
            var MOUSE_DIST = 160;

            function sizeCanvas() {
                var rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * DPR;
                canvas.height = rect.height * DPR;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                return rect;
            }

            function initParticles(rect) {
                var count = Math.round((rect.width * rect.height) / 14000);
                count = Math.max(40, Math.min(count, 140));
                particles = [];
                for (var i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * rect.width,
                        y: Math.random() * rect.height,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        r: Math.random() * 1.6 + 0.8
                    });
                }
            }

            var rect = sizeCanvas();
            if (!rect.width || !rect.height) {
                rect = { width: window.innerWidth, height: window.innerHeight };
            }
            initParticles(rect);

            function reinit() {
                var r = sizeCanvas();
                if (!r.width || !r.height) return;
                rect = r;
                initParticles(rect);
            }
            window.addEventListener('resize', reinit);
            window.addEventListener('load', reinit);
            /* Safety net: some file:// / slow-render cases report a 0-size rect
               on the very first measurement. Re-measure shortly after to catch it. */
            setTimeout(reinit, 60);
            setTimeout(reinit, 300);

            canvas.parentElement.addEventListener('mousemove', function(e) {
                var b = canvas.getBoundingClientRect();
                mouse.x = e.clientX - b.left;
                mouse.y = e.clientY - b.top;
            });
            canvas.parentElement.addEventListener('mouseleave', function() {
                mouse.x = null; mouse.y = null;
            });

            function step() {
                ctx.clearRect(0, 0, rect.width, rect.height);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > rect.width) p.vx *= -1;
                    if (p.y < 0 || p.y > rect.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + PARTICLE_COLOR + ', 0.75)';
                    ctx.fill();
                }

                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var a = particles[i], b = particles[j];
                        var dx = a.x - b.x, dy = a.y - b.y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < LINK_DIST) {
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = 'rgba(' + LINE_COLOR + ', ' + (0.18 * (1 - dist / LINK_DIST)) + ')';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }

                    if (mouse.x !== null) {
                        var p = particles[i];
                        var dx = p.x - mouse.x, dy = p.y - mouse.y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MOUSE_DIST) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.strokeStyle = 'rgba(' + LINE_COLOR + ', ' + (0.35 * (1 - dist / MOUSE_DIST)) + ')';
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        })();
    </script>
